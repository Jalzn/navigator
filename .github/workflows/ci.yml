name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Install verification tools
        run: |
          mise exec -- cargo install cargo-deny --version 0.20.2 --locked
          mise exec -- cargo install cargo-machete --version 0.9.2 --locked
      - name: Run project gate
        run: ./scripts/check.sh
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence
          path: target/conformance/
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Install coverage tooling
        run: |
          mise exec -- rustup component add llvm-tools-preview
          mise exec -- cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Generate coverage evidence
        run: ./scripts/coverage.sh
      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evidence
          path: target/coverage/
          if-no-files-found: error

